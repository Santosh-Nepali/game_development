<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link rel="stylesheet" href="./css/game.css">
    <script src="./js/main.js" defer></script>
</head>
<body>
    <main class="card">
        <h1>Create your account</h1>
        <p class="subtitle">Fill in the details below to sign up.</p>

        <form id="signupForm">
            <div class="row">
                <div class="field">
                    <label for="firstName">First name</label>
                    <input type="text" id="firstName" name="firstName" autocomplete="given-name" required>
                </div>
                <div class="field">
                    <label for="lastName">Last name</label>
                    <input type="text" id="lastName" name="lastName" autocomplete="family-name" required>
                </div>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="new-password"
                       minlength="8" required aria-describedby="passwordHint">
                <span class="hint" id="passwordHint">At least 8 characters.</span>
            </div>

            <div class="check">
                <input type="checkbox" id="age" name="age" required>
                <label for="age">I confirm that I am 13 years old or older.</label>
            </div>

            <button type="submit" class="btn primary">Sign up</button>

            <p class="divider">Already have an account?</p>
            <a href="login.html" class="btn secondary">Log in</a>

            <p id="message" role="status"></p>
        </form>
    </main>
</body>
</html>
