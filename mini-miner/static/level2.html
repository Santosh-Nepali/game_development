<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiniMiner - Level 2</title>
    <link href="../static/game.css" rel="stylesheet" />
  </head>

  <body class="level-page">
    <main class="level-menu">
      <div class="miner-box">
        <img src="../static/images/assets/boy1.png" alt="Miner" />
      </div>

      <div class="winch-treasure-box">
        <img src="../static/images/assets/winch_treasure.webp" alt="Winch" />
      </div>

      <div class="level-title">
        <h1>LEVEL 2</h1>
      </div>

      <div class="level-info">
        <div class="target-score">
          <img
            src="../static/images/assets/target_score.webp"
            alt="Target Score"
          />
          <p>700</p>
        </div>

        <div class="time">
          <p>75 seconds</p>
        </div>
      </div>

      <nav class="level-buttons">
        <a href="#">
          <img
            src="../static/images/buttons/next_level.webp"
            alt="Next Level"
          />
        </a>

        <a href="#"> Play Game </a>

        <a href="main-menu.html">
          <img src="../static/images/buttons/exit.webp" alt="Exit Main Menu" />
        </a>
      </nav>
    </main>
  </body>
</html>
