<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>MiniMiner - Main Menu</title>
    <link href="../static/game.css" rel="stylesheet" />
  </head>

  <body class="main-menu-page">
    <main class="main-menu">...</main>

    <main class="main-menu">
      <div class="main-board">
        <img
          src="../static/images/boards/main_board.webp"

          <img

          />

        <a href="#">
          <img
            src="../static/images/buttons/high_scores.webp"
            alt="High Scores"
          />
        </a>

          <img src="../static/images/buttons/exit.webp" alt="Exit" />
        </a>

      <div class="miner-box">
        <img src="../static/images/assets/boy1.png" alt="Miner" />
