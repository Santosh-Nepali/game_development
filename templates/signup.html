<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up – Mini Miner</title>
    <link rel="stylesheet" href="{{url_for('static', filename='css/style.css') }}">
    <script src="{{url_for('static', filename='script/script.js') }}" defer></script>
</head>
<body>
    <main class="panel">
        <a class="back" href="{{url_for('home')}}">&larr; Back</a>
        <h1>Join the miner team!</h1>

        <form id="signupForm">
            <div class="row">
                <div class="field">
                    <label for="firstName">First name</label>
                    <input type="text" id="firstName" name="firstName" autocomplete="given-name" required>
                </div>
                <div class="field">
                    <label for="lastName">Last name</label>
                    <input type="text" id="lastName" name="lastName" autocomplete="family-name" required>
                </div>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="new-password"
                       minlength="8" required aria-describedby="passwordHint">
                <span class="hint" id="passwordHint">At least 8 characters.</span>
            </div>

            <div class="check">
                <input type="checkbox" id="age" name="age" required>
                <label for="age">I confirm that I am 12 years old or older.</label>
            </div>

            <button type="submit" class="img-btn">
                <img src="{{url_for('static', filename='assets/images/signup.webp')}}" alt="Sign up" width="887" height="361">
            </button>

            <p class="switch">Already a miner? <a href="{{url_for('login')}}">Log in</a></p>
            <p id="message" role="status"></p>
        </form>
    </main>
</body>
</html>
